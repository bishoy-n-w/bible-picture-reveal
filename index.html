<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة كشف الصورة | مسابقات الكتاب المقدس</title>
  <meta name="description" content="لعبة كشف الصورة الكتابية التفاعلية مع بنك أسئلة ثلاثي الصعوبة ومؤثرات سينمائية للمسابقات والكرنفال.">

  <!-- Google Fonts: Cairo & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fullscreen Confetti Canvas Layer -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Application Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L1 21h22L12 2zm0 3.84L19.5 19H4.5L12 5.84zM11 10h2v4h-2zm0 6h2v2h-2z"/>
      </svg>
      <h1 class="brand-title">كشف الصورة الكتابية</h1>
    </div>

    <div class="header-status">
      <div class="round-badge">
        <span>الجولة:</span>
        <strong id="round-counter">1</strong>
      </div>
      <div class="round-badge">
        <span>المتبقي في البنك:</span>
        <strong id="remaining-counter">20</strong>
      </div>
    </div>
  </header>

  <!-- Central Game Stage -->
  <main class="stage-wrapper">
    <div class="cinematic-frame">
      <!-- Ornate Golden Corners -->
      <div class="frame-corner top-right"></div>
      <div class="frame-corner top-left"></div>
      <div class="frame-corner bottom-right"></div>
      <div class="frame-corner bottom-left"></div>

      <!-- Target Image Layer -->
      <div class="image-layer">
        <img id="bg-image" src="" alt="المشهد الكتابي">
        <canvas id="fallback-canvas" class="fallback-canvas"></canvas>
      </div>

      <!-- 3x3 Tile Grid Overlay -->
      <div id="grid-layer" class="grid-layer">
        <!-- 9 Tiles dynamically rendered by game.js -->
      </div>

      <!-- Win / Full Reveal Overlay Card -->
      <div id="win-overlay" class="win-overlay">
        <div class="win-card">
          <span class="win-title-badge">✦ تم كشف المشهد الكتابي بنجاح ✦</span>
          <h2 id="win-title" class="win-event-title">عنوان المشهد</h2>
          <span id="win-ref" class="win-reference-badge">(شاهد الآية)</span>
          <p id="win-verse" class="win-verse-quote">«نص الآية المباركة»</p>
          <div class="win-action-row">
            <button id="win-next-btn" class="mod-btn btn-reveal">
              <span>المشهد التالي (متابعة)</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Multiple Choice Question Modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="question-modal">
      <div class="modal-header-bar">
        <div class="modal-meta-left">
          <span id="modal-diff-tag" class="modal-difficulty-tag">مستوى سهل ✦</span>
          <span id="modal-tile-indicator" class="modal-tile-indicator">مربع رقم (1)</span>
        </div>
        <!-- Modal Cancel / Close Button -->
        <button id="btn-modal-close" class="modal-close-btn" title="إغلاق بدون إجابة (إلغاء)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <h3 id="question-text" class="question-text">نص السؤال هنا؟</h3>

      <div id="options-grid" class="options-grid">
        <!-- 4 Multiple choice options rendered by game.js -->
      </div>
    </div>
  </div>

  <!-- Moderator Control Toolbar (Unobtrusive) -->
  <footer class="moderator-toolbar">
    <div class="mod-left-group">
      <!-- Full Reveal Button -->
      <button id="btn-reveal-full" class="mod-btn btn-reveal" title="كشف الصورة كاملة والاحتفال (مفتاح R)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>كشف الصورة كاملة</span>
      </button>

      <!-- Next Image Button -->
      <button id="btn-next-image" class="mod-btn btn-next" title="الانتقال إلى صورة جديدة من البنك (مفتاح N)">
        <span>صورة جديدة</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Reset Grid Button -->
      <button id="btn-reset-grid" class="mod-btn" title="إعادة تغطية المربعات لنفس الصورة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>إعادة المربعات</span>
      </button>

      <!-- Jump to Scene Selector -->
      <div class="mod-select-wrapper">
        <select id="select-scene" class="mod-select" title="اختيار مشهد محدد">
          <option value="">-- المشاهد (1-20) --</option>
        </select>
      </div>
    </div>

    <div class="mod-right-group">
      <!-- Upload Custom Images Picker -->
      <label for="input-custom-images" class="mod-btn-icon" title="اختيار ملفات صور من جهازك (اختياري)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </label>
      <input type="file" id="input-custom-images" multiple accept="image/*" style="display: none;">

      <!-- Secret Peek for Moderator -->
      <div id="mod-peek-wrapper" class="mod-peek-wrapper">
        <button id="btn-mod-peek" class="mod-btn-icon" title="معاينة إجابة المشهد سراً للمشرف (مرر الفأرة أو اضغط)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <div class="mod-peek-popover">
          <div class="mod-peek-title">إجابة المشهد (خاص بالمشرف):</div>
          <div id="mod-peek-answer" class="mod-peek-answer">--</div>
          <div id="mod-peek-ref" class="mod-peek-ref">--</div>
        </div>
      </div>

      <!-- Audio Mute Toggle -->
      <button id="btn-toggle-audio" class="mod-btn-icon" title="كتم / تشغيل الصوت">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>

      <!-- Fullscreen Toggle -->
      <button id="btn-fullscreen" class="mod-btn-icon" title="ملء الشاشة">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </footer>

  <!-- Script Modules -->
  <script src="js/images-bank.js"></script>
  <script src="js/questions-bank.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
